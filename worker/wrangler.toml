name = "x402-bazaar-rank"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
PAY_TO = "0xECa891e34b3E5873181Fb779672564E198C55354"

# Журнал воркера (Workers Logs, бесплатный тариф): до 15.09 мы не видели, пробовал ли
# кто-нибудь заплатить и на чём это сорвалось — только суммарное число запросов.
[observability]
enabled = true

# Живая доска агентов (15.09): локальный воркер каждые несколько минут кладёт снимок
# переписки и решений агентов; /board отдаёт его публично. Бесплатный тариф KV.
[[kv_namespaces]]
binding = "BOARD"
id = "d8dead6728204878ace2d08cc77e28e1"

[build]
command = ""

# индекс подключается импортом из src/index.js и уезжает внутрь скрипта
rules = [
  { type = "Data", globs = ["**/*.json"], fallthrough = true }
]
