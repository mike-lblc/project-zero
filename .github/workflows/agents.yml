name: Agents cycle

# КРУГЛОСУТОЧНАЯ РАБОТА БЕЗ НОУТБУКА ВЛАДЕЛЬЦА.
#
# Что здесь было раньше и почему это было преувеличением: запускались ТРИ шага
# из тридцати восьми — проверка кошелька, обновление рынка и аудит целостности.
# Всё остальное жило только на машине владельца и умирало вместе с ней.
# Называть это «системой, работающей 24/7 в облаке» было нечестно.
#
# Теперь здесь работает ВСЁ, что физически может работать в облаке: список
# CLOUD_STEPS в agents/worker.py — и работает НЕПРЕРЫВНО, а не по одному
# обороту на пробуждение (см. шаг «Непрерывный облачный цикл»). Чего здесь нет — названо
# поимённо в CLOUD_CANNOT: локальная модель и локальный сервис остаются на
# машине владельца, и это ограничение среды, а не умолчание.
#
# ЧЕСТНО О БАЗЕ. Она весит больше двух мегабайт, и коммитить её каждые
# пятнадцать минут значило бы двести мегабайт в сутки в репозиторий. Поэтому
# облачная база живёт в артефакте между прогонами, а в репозиторий уходит
# только дашборд и снимок цифр — они маленькие и дают видимость снаружи.
#
# Из этого следует то, что нужно знать прямо: облачная и локальная базы
# РАЗНЫЕ и расходятся. Общая база потребовала бы размещённого хранилища
# (Cloudflare D1), и это отдельная работа, а не побочный эффект этой.
# Дашборд на Pages показывает ОБЛАЧНОЕ состояние и подписан соответственно.

on:
  schedule:
    # СТРАХОВКА, А НЕ ГЛАВНЫЙ БУДИЛЬНИК. Раньше от этой строки зависело всё:
    # «каждые 15 минут» на бумаге, ~6 запусков в сутки на деле (медиана 200 мин,
    # худший 347 — замерено по истории). Теперь прогон работает непрерывно пять
    # часов сам, а расписание нужно только чтобы поднять следующий. Раз в час
    # достаточно и не создаёт очередь из отменяемых запусков.
    - cron: '3,18,33,48 * * * *'
    # ПОЧЕМУ ЧЕТЫРЕ РАЗА В ЧАС, А НЕ РАЗ. Владелец прав в сути: будильник должен
    # звонить часто. Но звонит он не ради «96 отдельных прогонов» — рабочий
    # прогон один и живёт пять часов (см. «Непрерывный облачный цикл»). Частый
    # звонок нужен для БЫСТРОЙ ЗАМЕНЫ: если пятичасовой прогон умер на десятой
    # минуте, следующий поднимется в пределах 15 минут, а не часа.
    #
    # Лишние звонки НЕ создают кучу параллельных прогонов: concurrency-группа
    # держит один рабочий и не больше одного ожидающего, остальные срабатывания
    # GitHub отбрасывает. В истории будут записи «cancelled/skipped» — это не
    # падения, а будильник, звонящий в дверь, за которой уже работают.
    #
    # Минуты сдвинуты с круглых: GitHub документирует потерю schedule-событий на
    # 00/15/30/45. Больше 96 в сутки поставить нельзя при пятичасовом прогоне —
    # это и есть верхняя граница «96 срабатываний», которую просил владелец, без
    # дробления работы на 96 коротких кусков.
  workflow_dispatch:

concurrency:
  # Два одновременных прогона писали бы в одну базу и создавали ровно те
  # блокировки, от которых система умирала локально.
  group: agents-cycle
  cancel-in-progress: false

permissions:
  contents: write          # публикация дашборда
  actions: read            # память из предыдущего запуска

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Прогон живёт часами (см. «Непрерывный облачный цикл»), поэтому таймаут
    # 350: 300 минут цикла + запас на последний шаг и публикацию дашборда.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Найти последнюю сохранённую базу
        id: memory
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name: 'brain-db', per_page: 100
            });
            const candidates = artifacts.filter(a => !a.expired &&
              a.workflow_run && a.workflow_run.head_branch === context.ref.replace('refs/heads/', '') &&
              String(a.workflow_run.id) !== String(context.runId));
            candidates.sort((a, b) => b.id - a.id);
            if (candidates.length) {
              core.setOutput('run_id', String(candidates[0].workflow_run.id));
            } else {
              core.notice('Первый запуск: сохранённой базы ещё нет.');
            }

      - name: Поднять базу прошлого прогона
        if: steps.memory.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: brain-db
          path: data
          github-token: ${{ github.token }}
          run-id: ${{ steps.memory.outputs.run_id }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Установить зависимости проверок
        if: github.event_name == 'workflow_dispatch'
        run: pip install --quiet pytest

      - name: Сквозной аудит — только по ручному запуску
        id: deep_audit
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python ops/deep_audit.py

      - name: Сохранить отчёт аудита
        if: always() && steps.deep_audit.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: deep-audit-report
          path: reports/deep-audit.json
          retention-days: 7
          if-no-files-found: error

      - name: Облачное рассуждение и исполнение инструмента
        id: cloud_reasoning
        continue-on-error: true
        env:
          P0_MODEL_BACKEND: cloudflare
          P0_CLOUD_FREE_VERIFIED: '1'
          P0_CLOUDFLARE_ACCOUNT_ID: a8dd50703f4d727cd15c934aed9582d4
          P0_CLOUDFLARE_AI_TOKEN: ${{ secrets.P0_CLOUDFLARE_AI_TOKEN }}
          MOLTBOOK_API_KEY: ${{ secrets.P0_MOLTBOOK_API_KEY }}
          BOARD_TOKEN: ${{ secrets.P0_BOARD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python ops/cloud_turn.py

      # НЕПРЕРЫВНАЯ РАБОТА, А НЕ ШЕСТЬ ПРОБУЖДЕНИЙ В СУТКИ.
      #
      # Здесь был ОДИН проход по списку CLOUD_STEPS: цикл просыпался по cron,
      # обходил шаги по разу и умирал. Замер истории запусков показал настоящую
      # цену такой схемы: в расписании стоит '7,22,37,52 * * * *' — 96 прогонов
      # в сутки, а GitHub на самом деле запускал ~6. Медиана промежутка 200
      # минут, худший 347. Владелец спросил, почему платежи приходят раз в
      # несколько дней; вот прямой ответ — без его ноутбука экосистема жила шесть
      # раз в сутки по одному обороту, и денежные шаги просто не успевали идти.
      #
      # Репозиторий ПУБЛИЧНЫЙ, а для публичных репозиториев минуты Actions
      # бесплатны и не ограничены — то есть непрерывность здесь ничего не стоит
      # и правило «$0» не нарушает. Поэтому прогон теперь живёт пять часов и
      # крутит ТОТ ЖЕ цикл, что локальная машина (agents.worker.run_forever),
      # а расписание осталось страховкой: оно поднимает следующий прогон, когда
      # предыдущий дожил до предела.
      #
      # Предел 300 минут при таймауте 350 — запас на последний шаг (он может
      # длиться до двух минут) и на публикацию дашборда после цикла.
      - name: Непрерывный облачный цикл
        env:
          P0_CLOUDFLARE_AI_TOKEN: ${{ secrets.P0_CLOUDFLARE_AI_TOKEN }}
          WALLET_ETH: ${{ secrets.WALLET_ETH }}
          MOLTBOOK_API_KEY: ${{ secrets.P0_MOLTBOOK_API_KEY }}
          BOARD_TOKEN: ${{ secrets.P0_BOARD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          P0_CLOUD_MINUTES: '300'
        run: |
          mkdir -p data docs
          printf 'WALLET_ETH=%s\n' "$WALLET_ETH" > .env
          python - <<'PY'
          import os, sys
          sys.path.insert(0, '.')
          from core.db import init
          init()
          from agents import worker

          # Шаг, которого нет в цикле, — это опечатка в списке, и раньше она
          # молча считалась падением на каждом прогоне. Проверяем ОДИН раз.
          known = dict(worker.CYCLE + worker.SLOW_CYCLE)
          missing = [n for n in worker.CLOUD_STEPS if n not in known]
          if missing:
              print(f"::warning::в цикле нет шагов из CLOUD_STEPS: {missing}")

          minutes = int(os.environ.get("P0_CLOUD_MINUTES", "300"))
          print(f"облачный цикл: непрерывно {minutes} мин, "
                f"шагов доступно {len(worker.CLOUD_STEPS)}", flush=True)
          print(f"не могут работать в облаке: {list(worker.CLOUD_CANNOT)}", flush=True)
          worker.run_forever(interval=180, deadline_minutes=minutes,
                             only=set(worker.CLOUD_STEPS))
          PY

      - name: Растущий каталог инвариантов
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, '.')
          from core import regressions
          regressions.seed()
          # run() возвращает ещё и пропущенные; жёсткая распаковка в три
          # значения роняла этот шаг девять прогонов подряд.
          ok, bad, fails, skipped = regressions.run(verbose=False)
          print(f"инвариантов в каталоге: {regressions.count()}, "
                f"прошло {ok}, упало {bad}, пропущено {len(skipped) if hasattr(skipped, '__len__') else skipped}")
          for name, detail, _ in fails:
              print(f"::warning::инвариант нарушен — {name}: {detail}")
          PY

      - name: Собрать дашборд для публикации
        run: |
          python - <<'PY'
          import sys, json, subprocess
          sys.path.insert(0, '.')
          from core.db import connect
          c = connect()
          # Отсутствующая таблица — не повод ронять сборку: в облачной базе нет
          # того, что создаётся только локальным часовым аудитом. Ноль здесь
          # значит «этого тут не ведут», и это честнее, чем падение.
          def q(sql):
              try:
                  return (c.execute(sql).fetchone() or [0])[0]
              except Exception:
                  return 0
          def rows(sql):
              try:
                  return list(c.execute(sql))
              except Exception:
                  return []
          d = {
            'payments': q('SELECT COUNT(*) FROM payments'),
            'revenue': q("SELECT COALESCE(SUM(CAST(amount AS REAL)),0) FROM payments WHERE asset IN ('USDC','USDC.e','USDT','DAI','USD')"),
            'spend': q('SELECT COUNT(*) FROM spend'),
            'runs_24h': q("SELECT COUNT(*) FROM runs WHERE started_at > strftime('%Y-%m-%dT%H:%M:%S','now','-1 day')"),
            'errors_24h': q("SELECT COUNT(*) FROM runs WHERE status='error' AND started_at > strftime('%Y-%m-%dT%H:%M:%S','now','-1 day')"),
            'evidence': q('SELECT COUNT(*) FROM evidence'),
            'sources': q('SELECT COUNT(*) FROM sources'),
            'leads': q('SELECT COUNT(*) FROM leads'),
            'reachable': q('SELECT COUNT(*) FROM leads WHERE reachable=1'),
            'paths': q('SELECT COUNT(*) FROM money_paths'),
            'paths_open': q('SELECT COUNT(*) FROM money_paths WHERE open_to_us=1'),
            'categories': q('SELECT COUNT(*) FROM path_categories'),
            'blind': q('SELECT COUNT(*) FROM path_categories WHERE searched_at IS NULL'),
            'claims': q('SELECT COUNT(*) FROM claim_checks WHERE verified=1'),
            'prs': q('SELECT COUNT(*) FROM pull_requests'),
            'cycles': q('SELECT COUNT(*) FROM audit_cycles'),
            'fixes': q("SELECT COUNT(*) FROM code_fixes WHERE outcome='applied'"),
          }
          d['matrix'] = [dict(zip(('stage','owner','verdict','blocker'), r)) for r in
                         rows('SELECT stage,owner_agent,verdict,blocker FROM capability_matrix ORDER BY ord')]
          d['agents'] = [dict(zip(('agent','runs','errors'), r)) for r in
                         rows("SELECT agent,COUNT(*),SUM(status='error') FROM runs "
                              "WHERE started_at>strftime('%Y-%m-%dT%H:%M:%S','now','-1 day') GROUP BY agent "
                              "ORDER BY COUNT(*) DESC")]
          d['open_paths'] = [dict(zip(('platform','category','score'), r)) for r in
                             rows('SELECT platform,category,score FROM money_paths '
                              'WHERE open_to_us=1 ORDER BY score DESC LIMIT 10')]
          d['walls'] = [dict(zip(('wall','n'), r)) for r in
                        rows('SELECT wall,COUNT(*) FROM money_paths WHERE wall IS NOT NULL '
                             'GROUP BY wall ORDER BY COUNT(*) DESC')]
          d['msgs'] = {t: q(f"SELECT COUNT(*) FROM messages WHERE topic='{t}'")
                       for t in ('ask','answer','handoff','chat')}
          c.close()
          open('data/snapshot.json','w',encoding='utf-8').write(
              json.dumps(d, ensure_ascii=False, indent=1))
          PY
          # Состав для дашборда берётся из реестра агентов, а не из рукописного
          # списка в server.js — там было 24 карточки при 18 агентах.
          python -c "import sys; sys.path.insert(0, '.'); from core import roster; print(roster.export())"
          python ops/build_snapshot.py docs/floor.html
          echo "дашборд собран для публикации"

      # Дашборд со сценой живёт на машине владельца и по сети недоступен. Здесь
      # снимается та же выдача, которой он питается дома, — ТЕМ ЖЕ сервером, а
      # не второй реализацией тех же запросов: две реализации расходятся всегда,
      # и в какой-то день облако начинает показывать другое число, чем дом.
      - name: Node для снятия выдачи
        uses: actions/setup-node@v7
        with:
          # 24, а не 20: сервер читает базу через node:sqlite, а этот встроенный
          # модуль появился только в 22-й версии. На двадцатой он поднимался и
          # падал с «No such built-in module», и снимок не снимался.
          node-version: '24'

      - name: Снять выдачу для облачного дашборда
        run: |
          npm --prefix service ci --omit=dev --no-audit --no-fund || npm --prefix service install --omit=dev --no-audit --no-fund
          cp service/dashboard.html docs/dashboard.html
          python ops/export_api.py docs/api 8402

      - name: Сохранить базу до следующего прогона
        if: always() && hashFiles('data/brain.db') != ''
        uses: actions/upload-artifact@v7
        with:
          name: brain-db
          path: data/brain.db
          retention-days: 30
          overwrite: true

      - name: Опубликовать дашборд
        run: |
          git config user.name  "p0-agents"
          git config user.email "agents@project-zero.local"
          git add -f docs/floor.html docs/dashboard.html docs/api || true
          if git diff --cached --quiet; then
            echo "состояние не изменилось — публиковать нечего"
          else
            git commit -m "chore(agents): облачный цикл $(date -u +%Y-%m-%dT%H:%MZ)"
            # GitHub однажды вернул HTTP 500 на git push после полностью
            # успешного цикла. Публикация — сетевое действие: временный отказ
            # повторяется ограниченно, а конфликт rebase остаётся видимым.
            for attempt in 1 2 3 4; do
              status=0
              git pull --rebase --autostash origin main || status=$?
              if [ "$status" -eq 0 ]; then
                git push origin HEAD:main || status=$?
              fi
              if [ "$status" -eq 0 ]; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 4 ]; then
                echo "публикация не удалась после $attempt попыток" >&2
                exit "${status:-1}"
              fi
              sleep $((attempt * 5))
            done
          fi

      - name: Состояние миссии
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, '.')
          from core.db import connect
          c = connect()
          pays = c.execute("SELECT COUNT(*) FROM payments").fetchone()[0]
          spend = c.execute("SELECT COUNT(*) FROM spend").fetchone()[0]
          c.close()
          print(f"::notice::платежей {pays}, потрачено {spend}")
          if spend:
              print("::error::ТАБЛИЦА ТРАТ НЕ ПУСТА — заявление «с нуля» недействительно")
              sys.exit(1)
          if pays:
              print("::warning::ПЛАТЁЖ ОБНАРУЖЕН — проверить, что он от постороннего")
          PY

      - name: Сообщить об отказе облачного рассуждения
        if: always() && steps.cloud_reasoning.outcome == 'failure'
        run: |
          echo "::error::Cloud reasoning failed; inspect cloud_turns and agent_decisions"
          exit 1

      - name: Сообщить о провале сквозного аудита
        if: always() && steps.deep_audit.outcome == 'failure'
        run: exit 1
