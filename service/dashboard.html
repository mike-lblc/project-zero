<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P0 Agent Floor</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --void:#05070c; --panel:rgba(10,15,24,.82); --line:rgba(96,132,196,.18);
  --ink:#e4ecf8; --dim:#7a8aa6; --faint:#4e5c75;
  --ok:#35d6a4; --warn:#f2b544; --bad:#ff5f6d; --acc:#4d9fff; --vio:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--void);color:var(--ink);
  font:14px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
#c{position:fixed;inset:0;display:block}
.mono,.n{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;
  font-variant-numeric:tabular-nums}

/* ───────────────────────────── верхняя полоса: только миссия */
#top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:stretch;
  gap:0;background:linear-gradient(180deg,rgba(5,7,12,.94),rgba(5,7,12,.72));
  border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.brand{display:flex;flex-direction:column;justify-content:center;padding:10px 18px;
  border-right:1px solid var(--line);min-width:146px}
.brand b{font-size:15px;font-weight:700;letter-spacing:.4px}
.brand span{font-size:10px;color:var(--faint);letter-spacing:.9px;text-transform:uppercase}
.kpi{display:flex;flex-direction:column;justify-content:center;padding:9px 16px;
  border-right:1px solid var(--line);cursor:pointer;transition:background .15s;min-width:92px}
.kpi:hover{background:rgba(77,159,255,.07)}
.kpi.on{background:rgba(77,159,255,.12)}
.kpi b{font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums}
.kpi span{font-size:9.5px;color:var(--dim);letter-spacing:.7px;text-transform:uppercase;
  margin-top:3px;white-space:nowrap}
.kpi.zero b{color:var(--faint)} .kpi.good b{color:var(--ok)}
.kpi.alert b{color:var(--bad)} .kpi.hold b{color:var(--warn)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 18px;
  font-size:11px;color:var(--dim);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 10px var(--ok);animation:p 2s ease-in-out infinite}
@keyframes p{50%{opacity:.3}}

/* ───────────────────────────── боковая панель */
#side{position:fixed;top:57px;right:0;bottom:0;width:400px;z-index:5;display:flex;
  flex-direction:column;background:var(--panel);border-left:1px solid var(--line);
  backdrop-filter:blur(20px)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:10.5px;letter-spacing:.6px;
  text-transform:uppercase;color:var(--faint);cursor:pointer;border-bottom:2px solid transparent;
  transition:.15s;position:relative}
.tab:hover{color:var(--dim)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.tab i{font-style:normal;position:absolute;top:5px;right:8px;font-size:9px;
  background:var(--bad);color:#fff;border-radius:8px;padding:0 4px;line-height:13px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 28px}
.body::-webkit-scrollbar{width:7px}
.body::-webkit-scrollbar-thumb{background:rgba(96,132,196,.25);border-radius:4px}

h3{margin:22px 0 9px;font-size:9.5px;letter-spacing:1.2px;color:var(--faint);
  text-transform:uppercase;font-weight:600}
h3:first-child{margin-top:2px}

/* строка данных — компактная, ничего не обрезается */
.row{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:baseline;
  padding:8px 0;border-bottom:1px solid rgba(96,132,196,.09)}
.row:last-child{border-bottom:0}
.row .t{font-size:13px;min-width:0;overflow-wrap:anywhere}
.row .v{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--dim);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.row .s{grid-column:1/-1;font-size:11px;color:var(--faint);overflow-wrap:anywhere}
.row.ok .v{color:var(--ok)} .row.bad .v{color:var(--bad)} .row.hold .v{color:var(--warn)}

.pill{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:9px;
  letter-spacing:.5px;padding:2px 6px;border-radius:3px;background:rgba(96,132,196,.14);
  color:var(--dim);margin-right:6px;vertical-align:1px}
.pill.ok{background:rgba(53,214,164,.14);color:var(--ok)}
.pill.bad{background:rgba(255,95,109,.14);color:var(--bad)}
.pill.hold{background:rgba(242,181,68,.14);color:var(--warn)}

.card{border:1px solid var(--line);border-left:2px solid var(--acc);border-radius:3px;
  padding:11px 13px;margin-bottom:9px;background:rgba(8,13,22,.5)}
.card.bad{border-left-color:var(--bad)} .card.ok{border-left-color:var(--ok)}
.card .h{font-size:12.5px;margin-bottom:5px;overflow-wrap:anywhere}
.card .d{font-size:11px;color:var(--dim);overflow-wrap:anywhere}
.empty{color:var(--faint);font-size:12px;padding:18px 0;text-align:center}

.msg{padding:7px 0;border-bottom:1px solid rgba(96,132,196,.08);font-size:12px;
  overflow-wrap:anywhere}
.msg:last-child{border-bottom:0}
.msg .w{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--acc);
  margin-right:7px}
.msg .x{color:var(--dim)}
/* Адресованное сообщение отличается от объявления всем: у переписки есть
   второй участник, и это единственное, что отличает разговор от монолога. */
.msg.direct{border-left:2px solid var(--acc);padding-left:8px;
  background:linear-gradient(90deg,rgba(77,159,255,.06),transparent 60%)}

/* мини-шкала */
.bar{height:3px;border-radius:2px;background:rgba(96,132,196,.16);overflow:hidden;
  margin-top:6px;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--ok);border-radius:2px}

#card{position:fixed;left:16px;top:73px;z-index:7;width:min(300px,calc(100vw - 432px));
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:13px 15px;
  backdrop-filter:blur(20px);display:none}
#card b{font-size:13.5px} #card .r{font-size:11px;color:var(--dim);margin:4px 0 9px}
#card .k{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0}
#card .k span{color:var(--faint)}
#card .k b{font-family:"JetBrains Mono",monospace;font-size:11.5px}

#feed{position:fixed;left:16px;bottom:16px;z-index:6;width:min(380px,calc(100vw - 432px));
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 13px;
  backdrop-filter:blur(20px);max-height:150px;overflow:hidden}
#feed .l{font-size:11px;color:var(--dim);padding:2px 0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#feed .l b{font-family:"JetBrains Mono",monospace;color:var(--acc);font-weight:400}

@media(max-width:1000px){
  #side{width:100%;top:auto;height:56vh;border-left:0;border-top:1px solid var(--line)}
  #card,#feed{display:none!important}
  .kpi{min-width:74px;padding:8px 11px} .kpi b{font-size:16px}
}
</style></head><body>
<canvas id="c"></canvas>

<div id="top">
  <div class="brand"><b>P0</b><span>agent floor</span></div>
  <div class="kpi" data-t="money"><b id="k-pay">–</b><span>платежи</span></div>
  <div class="kpi good" data-t="money"><b id="k-spend">–</b><span>потрачено</span></div>
  <div class="kpi" data-t="chain"><b id="k-chain">–</b><span>цепочка</span></div>
  <div class="kpi" data-t="agents"><b id="k-runs">–</b><span>шагов/сутки</span></div>
  <div class="kpi" data-t="agents"><b id="k-err">–</b><span>сбоев</span></div>
  <div class="kpi" data-t="queue"><b id="k-you">–</b><span>твоё решение</span></div>
  <div class="live"><span class="dot"></span><span id="live">подключаюсь</span></div>
</div>

<div id="side">
  <div class="tabs">
    <div class="tab on" data-t="money">Деньги</div>
    <div class="tab" data-t="chain">Цепочка</div>
    <div class="tab" data-t="agents">Агенты</div>
    <div class="tab" data-t="queue">Очередь<i id="b-q" hidden>0</i></div>
    <div class="tab" data-t="chat">Чат</div>
  </div>
  <div class="body">
    <div id="v-money"></div>
    <div id="v-chain" hidden></div>
    <div id="v-agents" hidden></div>
    <div id="v-queue" hidden></div>
    <div id="v-chat" hidden></div>
  </div>
</div>

<div id="card"></div>
<div id="feed"></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

/* ═══════════════════════════════════════════ АГЕНТЫ СЦЕНЫ
   Список совпадает с реестром на сервере — расхождение ловится аудитом. */
const AGENTS = [
  {id:"orchestrator", label:"ОРКЕСТРАТОР",      color:0x4d9fff, form:"core"},
  {id:"scout",        label:"РАЗВЕДЧИК",        color:0x35d6a4, form:"probe"},
  {id:"judge",        label:"СУДЬЯ",            color:0xa78bfa, form:"prism"},
  {id:"verifier",     label:"ПРОВЕРЯЮЩИЙ",      color:0x67e8f9, form:"prism"},
  {id:"critic",       label:"КРИТИК",           color:0xff5f6d, form:"spike"},
  {id:"adversary",    label:"ПРОТИВНИК",        color:0xf87171, form:"spike"},
  {id:"explorer",     label:"ИССЛЕДОВАТЕЛЬ",    color:0xfbbf24, form:"probe"},
  {id:"optimizer",    label:"ОПТИМИЗАТОР",      color:0x34d399, form:"ring"},
  {id:"watchdog",     label:"СТОРОЖ",           color:0xf2b544, form:"eye"},
  {id:"merchant",     label:"ТОРГОВЕЦ",         color:0x22d3ee, form:"ring"},
  {id:"distributor",  label:"ДИСТРИБЬЮТОР",     color:0x818cf8, form:"ring"},
  {id:"scribe",       label:"ЛЕТОПИСЕЦ",        color:0x94a3b8, form:"core"},
  {id:"postman",      label:"ПОЧТАЛЬОН",        color:0x2dd4bf, form:"probe"},
  {id:"leads",        label:"РАЗВЕДКА КЛИЕНТОВ",color:0xfbbf24, form:"probe"},
  {id:"salesman",     label:"ПРОДАВЕЦ",         color:0x4ade80, form:"prism"},
  {id:"mechanic",     label:"МЕХАНИК",          color:0x94a3b8, form:"spike"},
  {id:"bounty",       label:"ОХОТНИК",          color:0xfacc15, form:"spike"},
  {id:"craftsman",    label:"МАСТЕРОВОЙ",       color:0xf97316, form:"prism"},
  {id:"prospector",   label:"РАЗВЕДЧИК ДЕНЕГ",  color:0xa78bfa, form:"probe"},
  {id:"browser_scout",label:"БРАУЗЕРНЫЙ",       color:0x60a5fa, form:"eye"},
  {id:"proposer",     label:"ПРЕДЛАГАЮЩИЙ",     color:0x7dd3fc, form:"prism"},
  {id:"executor", label:"ИСПОЛНИТЕЛЬ", color:0x59ccaa, form:"ring"},
  {id:"supplier",     label:"СНАБЖЕНЕЦ",        color:0x2dd4bf, form:"ring"},
  {id:"improver",     label:"УЛУЧШАТЕЛЬ",      color:0xf472b6, form:"spike"},
];

/* Объявлено ДО animate(): цикл отрисовки стартует раньше блока данных, и
   обращение к ещё не созданной переменной роняет весь модуль. */
let liveLabel = "подключаюсь";

const canvas = document.getElementById("c");
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070c, 0.016);

/* Размер холста НИКОГДА не нулевой. Скрытая или свёрнутая вкладка отдаёт
   innerWidth === 0, и тогда кадровый буфер создаётся нулевым: после этого
   сцена сыплет «Framebuffer is incomplete» каждый кадр и на части машин
   остаётся чёрной навсегда — состояние, из которого она сама не выходит.
   Двести шестьдесят семь таких ошибок мы поймали на живой странице. */
const vw = () => Math.max(1, innerWidth || document.documentElement.clientWidth || 1);
const vh = () => Math.max(1, innerHeight || document.documentElement.clientHeight || 1);
const camera = new THREE.PerspectiveCamera(50, vw()/vh(), 0.1, 300);
camera.position.set(0, 6, 30);

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(vw(), vh());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

/* СВЕЧЕНИЕ. Ровно оно отличает «фигуры из пейнта» от живой сцены: свет
   растекается за границы объекта, и эмиссия читается как энергия, а не
   как заливка цветом. */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(vw(), vh()), 0.85, 0.62, 0.18);
composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0x24406e, 1.1));
const key = new THREE.PointLight(0x6fa8ff, 240, 140); key.position.set(14, 20, 16);
const fill = new THREE.PointLight(0xff7a9a, 90, 110); fill.position.set(-16, -8, -12);
const rim = new THREE.PointLight(0x35d6a4, 70, 100); rim.position.set(0, -14, 18);
scene.add(key, fill, rim);

/* звёздное поле: две плотности, чтобы была глубина */
function starfield(count, spread, size, color, opacity){
  const g = new THREE.BufferGeometry(), p = [];
  for (let i=0;i<count;i++)
    p.push((Math.random()-.5)*spread, (Math.random()-.5)*spread*.55,
           (Math.random()-.5)*spread);
  g.setAttribute("position", new THREE.Float32BufferAttribute(p,3));
  return new THREE.Points(g, new THREE.PointsMaterial({
    color, size, transparent:true, opacity, depthWrite:false,
    blending:THREE.AdditiveBlending}));
}
scene.add(starfield(900, 190, .34, 0x4f7cc0, .55));
scene.add(starfield(260, 120, .62, 0x9fd0ff, .35));

/* опорная сетка — тонкая, чтобы не спорить с агентами */
const grid = new THREE.GridHelper(140, 56, 0x16335c, 0x0d1c33);
grid.material.transparent = true; grid.material.opacity = .34;
grid.position.y = -7; scene.add(grid);

/* ═══════════════════════════════════════════ ФОРМЫ АГЕНТОВ
   Каждый агент — не одна фигура, а сборка: светящееся ядро, каркасная
   оболочка и кольцо. Оболочка вращается независимо от ядра, поэтому силуэт
   всё время меняется и объект читается объёмным. */
function buildAgent(spec){
  const g = new THREE.Group();
  const col = new THREE.Color(spec.color);

  const coreMat = new THREE.MeshStandardMaterial({
    color: col, emissive: col, emissiveIntensity: 1.5,
    roughness: .25, metalness: .65});
  const shellMat = new THREE.MeshBasicMaterial({
    color: col, wireframe: true, transparent: true, opacity: .34});
  const ringMat = new THREE.MeshStandardMaterial({
    color: col, emissive: col, emissiveIntensity: .85,
    roughness: .3, metalness: .8, transparent: true, opacity: .85});

  let coreGeo, shellGeo;
  if (spec.form === "core")   { coreGeo = new THREE.IcosahedronGeometry(.78, 1);
                                shellGeo = new THREE.IcosahedronGeometry(1.42, 1); }
  else if (spec.form === "probe") { coreGeo = new THREE.ConeGeometry(.6, 1.9, 6);
                                shellGeo = new THREE.OctahedronGeometry(1.36, 0); }
  else if (spec.form === "prism") { coreGeo = new THREE.OctahedronGeometry(.82, 0);
                                shellGeo = new THREE.BoxGeometry(1.8,1.8,1.8); }
  else if (spec.form === "spike") { coreGeo = new THREE.TetrahedronGeometry(.95, 0);
                                shellGeo = new THREE.TetrahedronGeometry(1.62, 1); }
  else if (spec.form === "ring")  { coreGeo = new THREE.TorusKnotGeometry(.5,.19,64,10);
                                shellGeo = new THREE.IcosahedronGeometry(1.4, 0); }
  else                        { coreGeo = new THREE.SphereGeometry(.72, 20, 14);
                                shellGeo = new THREE.IcosahedronGeometry(1.44, 1); }

  const core = new THREE.Mesh(coreGeo, coreMat); g.add(core);
  const shell = new THREE.Mesh(shellGeo, shellMat); g.add(shell);

  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.75, .045, 8, 40), ringMat);
  ring.rotation.x = Math.PI/2.1; g.add(ring);

  /* ореол: спрайт с мягким градиентом — свечение видно и когда объект далеко */
  const cv = document.createElement("canvas"); cv.width = cv.height = 128;
  const ctx = cv.getContext("2d");
  const grd = ctx.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0, "rgba(255,255,255,.9)");
  grd.addColorStop(.25, `rgba(${(col.r*255)|0},${(col.g*255)|0},${(col.b*255)|0},.55)`);
  grd.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true, opacity: .7}));
  halo.scale.set(6,6,1); g.add(halo);

  g.userData = {spec, core, shell, ring, halo, coreMat, ringMat,
                phase: Math.random()*Math.PI*2, active: 0};
  return g;
}

/* расстановка по двойной спирали — читается лучше кольца или решётки */
const nodes = [];
AGENTS.forEach((spec, i) => {
  const g = buildAgent(spec);
  const t = i / AGENTS.length;
  const arm = i % 2 ? 1 : -1;
  const r = 9 + t * 12;
  const a = t * Math.PI * 2.6 + (arm > 0 ? 0 : Math.PI);
  g.position.set(Math.cos(a) * r, (t - .5) * 9 + Math.sin(i * 1.7) * 1.4,
                 Math.sin(a) * r * .8);
  g.userData.home = g.position.clone();
  scene.add(g); nodes.push(g);
});

/* связи: тонкие линии, по которым бегут импульсы реальных сообщений */
const linkMat = new THREE.LineBasicMaterial({
  color: 0x3a6ea8, transparent: true, opacity: .16, blending: THREE.AdditiveBlending});
const links = [];
for (let i=0;i<nodes.length;i++){
  for (const j of [(i+1)%nodes.length, (i+5)%nodes.length]){
    if (i === j) continue;
    const geo = new THREE.BufferGeometry().setFromPoints(
      [nodes[i].position, nodes[j].position]);
    const line = new THREE.Line(geo, linkMat);
    scene.add(line); links.push({line, a:i, b:j});
  }
}

const pulses = [];
const pulseGeo = new THREE.SphereGeometry(.16, 10, 8);
function sendPulse(from, to, color){
  const m = new THREE.Mesh(pulseGeo, new THREE.MeshBasicMaterial({
    color, transparent: true, blending: THREE.AdditiveBlending}));
  m.position.copy(nodes[from].position); scene.add(m);
  pulses.push({m, from, to, t:0});
}

/* ═══════════════════════════════════════════ КАМЕРА
   Стрелки двигают камеру в пространстве, мышь поворачивает взгляд. */
const fly = {vx:0, vy:0, vz:0, yaw:0, pitch:-.12, keys:{}, drag:false, px:0, py:0};
addEventListener("keydown", e => { fly.keys[e.code] = true;
  if (e.code.startsWith("Arrow")) e.preventDefault(); });
addEventListener("keyup", e => fly.keys[e.code] = false);
canvas.addEventListener("mousedown", e => {fly.drag = true; fly.px = e.clientX; fly.py = e.clientY;});
addEventListener("mouseup", () => fly.drag = false);
addEventListener("mousemove", e => {
  if (!fly.drag) return;
  fly.yaw -= (e.clientX - fly.px) * .004;
  fly.pitch = Math.max(-1.2, Math.min(1.2, fly.pitch - (e.clientY - fly.py) * .004));
  fly.px = e.clientX; fly.py = e.clientY;
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const d = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  camera.position.addScaledVector(d, -e.deltaY * .035);
}, {passive:false});

/* клик по агенту — карточка с его реальными числами */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let moved = false;
canvas.addEventListener("mousedown", () => moved = false);
canvas.addEventListener("mousemove", () => { if (fly.drag) moved = true; });
canvas.addEventListener("click", e => {
  if (moved) return;
  mouse.x = (e.clientX/vw())*2-1; mouse.y = -(e.clientY/vh())*2+1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(nodes, true)[0];
  if (!hit) { document.getElementById("card").style.display = "none"; return; }
  let g = hit.object; while (g.parent && !g.userData.spec) g = g.parent;
  showCard(g.userData.spec.id);
});

addEventListener("resize", () => {
  camera.aspect = vw()/vh(); camera.updateProjectionMatrix();
  renderer.setSize(vw(), vh());
  composer.setSize(vw(), vh());
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  /* полёт камеры */
  const sp = 22 * dt;
  const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
  if (fly.keys.ArrowUp || fly.keys.KeyW) camera.position.addScaledVector(fwd, sp);
  if (fly.keys.ArrowDown || fly.keys.KeyS) camera.position.addScaledVector(fwd, -sp);
  if (fly.keys.ArrowLeft || fly.keys.KeyA) camera.position.addScaledVector(right, -sp);
  if (fly.keys.ArrowRight || fly.keys.KeyD) camera.position.addScaledVector(right, sp);
  if (fly.keys.Space) camera.position.y += sp;
  if (fly.keys.ShiftLeft) camera.position.y -= sp;
  camera.quaternion.setFromEuler(new THREE.Euler(fly.pitch, fly.yaw, 0, "YXZ"));

  /* агенты: ядро и оболочка крутятся врозь, активность даёт пульс */
  nodes.forEach((g, i) => {
    const u = g.userData;
    u.core.rotation.y += dt * (.35 + u.active * 1.6);
    u.core.rotation.x += dt * .18;
    u.shell.rotation.y -= dt * (.14 + u.active * .5);
    u.shell.rotation.z += dt * .09;
    u.ring.rotation.z += dt * (.5 + u.active);
    const puls = 1 + Math.sin(t*1.6 + u.phase) * .045 + u.active * .09;
    u.core.scale.setScalar(puls);
    u.coreMat.emissiveIntensity = 1.1 + u.active * 1.9
      + Math.sin(t*2.2 + u.phase) * .22;
    u.halo.material.opacity = .42 + u.active * .5;
    u.halo.scale.setScalar(5.4 + u.active * 2.4);
    g.position.y = u.home.y + Math.sin(t*.55 + u.phase) * .55;
    u.active = Math.max(0, u.active - dt * .45);
  });

  /* импульсы сообщений */
  for (let i = pulses.length-1; i >= 0; i--){
    const p = pulses[i]; p.t += dt * .85;
    if (p.t >= 1){ scene.remove(p.m); p.m.material.dispose(); pulses.splice(i,1); continue; }
    p.m.position.lerpVectors(nodes[p.from].position, nodes[p.to].position, p.t);
    p.m.material.opacity = Math.sin(p.t * Math.PI);
    p.m.scale.setScalar(.8 + Math.sin(p.t*Math.PI)*.9);
  }
  /* Происхождение данных видно ВСЕГДА, а счётчик пролетающих искр — это
     украшение поверх него. Раньше счётчик перетирал подпись, и почти всё
     время страница не говорила, живой перед вами поток или вчерашний снимок:
     самое важное сообщение исчезало именно тогда, когда система работала. */
  document.getElementById("live").textContent =
    liveLabel + (pulses.length ? ` · в полёте ${pulses.length}` : "");

  composer.render();
}
animate();

/* ═══════════════════════════════════════════ ДАННЫЕ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const num = n => (n ?? 0).toLocaleString("ru-RU");
const state = {};

document.querySelectorAll(".tab").forEach(tb => tb.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === tb));
  ["money","chain","agents","queue","chat"].forEach(k =>
    $("v-"+k).hidden = (k !== tb.dataset.t));
});
document.querySelectorAll(".kpi").forEach(k => k.onclick = () => {
  const tb = document.querySelector(`.tab[data-t="${k.dataset.t}"]`);
  if (tb) tb.click();
});

function kpi(id, val, cls){
  const el = $(id); el.textContent = val;
  el.parentElement.className = "kpi" + (cls ? " " + cls : "");
}

function row(title, value, sub, cls){
  return `<div class="row ${cls||""}"><div class="t">${title}</div>`
       + `<div class="v">${value}</div>`
       + (sub ? `<div class="s">${sub}</div>` : "") + "</div>";
}

/* Один и тот же дашборд работает в двух местах, и это не ухищрение, а
   следствие устройства: живой сервер стоит на машине владельца, а в облаке
   доступны только файлы. Сначала спрашиваем живой поток; если его нет —
   берём снимок, выложенный облачным прогоном, и ПОДПИСЫВАЕМ как снимок.
   Показывать снимок под видом живого потока значит выдавать вчерашнее
   состояние за сегодняшнее. */
let dataSource = null;          // "live" | "snapshot"
let snapshotAt = null;

async function get(path){
  const name = path.replace("/api/", "");
  if (dataSource !== "snapshot") {
    try {
      const r = await fetch(path, {cache:"no-store", signal:AbortSignal.timeout(8000)});
      if (r.ok) { dataSource = "live"; return await r.json(); }
    } catch { /* сервера рядом нет — идём за снимком */ }
  }
  try {
    const r = await fetch(`api/${name}.json`);
    if (!r.ok) return null;
    dataSource = "snapshot";
    const j = await r.json();
    if (j && j.__snapshot_at) snapshotAt = j.__snapshot_at;
    return j;
  } catch { return null; }
}

async function tick(){
  let values;
  if(window.P0_LIVE){
    try {
      const r = await fetch('/api/all', {cache:'no-store', signal:AbortSignal.timeout(8000)});
      if(!r.ok) throw new Error('Cloud unavailable');
      const d = await r.json(); values = [d.status,d.execution,d.queue,d.chat,d.pulse]; dataSource='live';
    } catch {
      liveLabel='НЕТ СВЯЗИ · показаны последние полученные данные';
      return;
    }
  } else values = await Promise.all([get("/api/status"),get("/api/execution"),get("/api/queue"),get("/api/chat"),get("/api/pulse")]);
  const [st, ex, q, chat, pulse] = values;
  if (!st) { liveLabel = "данных нет: ни живого сервера, ни снимка"; return; }
  Object.assign(state, {st, ex, q, chat, pulse});

  const pays = st.payments ?? 0, spend = st.spend ?? 0;
  kpi("k-pay", num(pays), pays ? "good" : "zero");
  kpi("k-spend", num(spend), spend ? "alert" : "good");

  const mOk = ex?.matrix_ok ?? 0, mTot = (ex?.matrix || []).length;
  kpi("k-chain", mTot ? `${mOk}/${mTot}` : "–",
      mTot && mOk === mTot ? "good" : (mOk > mTot/2 ? "hold" : "alert"));

  const runs = (pulse?.runs || []).length;
  const errs = (pulse?.runs || []).filter(r => r.status === "error").length;
  kpi("k-runs", num(st.runs_24h ?? runs));
  kpi("k-err", num(st.errors_24h ?? errs), (st.errors_24h ?? errs) ? "alert" : "good");

  const you = (q?.interventions || []).length + (q?.escalations || []).length;
  kpi("k-you", num(you), you ? "hold" : "good");
  const badge = $("b-q"); badge.hidden = !you; badge.textContent = you;

  liveLabel = dataSource === "live" ? "живой поток"
            : ("снимок облака" + (snapshotAt ? " · " + snapshotAt.slice(0,16).replace("T"," ") + " UTC" : ""));
  if (st.cloud_updated_at) liveLabel = (st.cloud_stale ? "СВЯЗЬ УСТАРЕЛА" : "ОБЛАКО") + " · " + (st.cloud_phase === "running" ? `${st.cloud_agent}: ${st.cloud_step}` : "ожидание следующего запуска") + " · " + new Date(st.cloud_updated_at).toLocaleTimeString();
  renderMoney(); renderChain(); renderAgents(); renderQueue(); renderChat();
  if(!window.P0_LIVE) animateActivity();
}

function renderMoney(){
  const ex = state.ex || {}, st = state.st || {};
  let h = "<h3>Миссия</h3>";
  h += row("Платежей получено", num(st.payments ?? 0), null,
           (st.payments ?? 0) ? "ok" : "");
  h += row("Потрачено", num(st.spend ?? 0),
           "заявление «с нуля» действительно, пока здесь ноль",
           (st.spend ?? 0) ? "bad" : "ok");

  if(ex.restricted){ h += `<div class="empty">Подробности работ доступны в основном журнале. Здесь показана публичная телеметрия облачного цикла.</div>`; $("v-money").innerHTML=h; return; }
  h += "<h3>Открытые пути к деньгам</h3>";
  const open = (ex.money_paths || []).filter(p => p.open_to_us === 1);
  if (!open.length) h += `<div class="empty">открытых путей сейчас нет</div>`;
  open.slice(0,6).forEach(p => {
    h += row(esc(p.platform), Math.round(p.score || 0), esc(p.category), "ok");
  });
  if (ex.path_stats) {
    const s = ex.path_stats;
    h += row("Классов в обходе", `${s.categories - s.blind_categories}/${s.categories}`,
             s.blind_categories ? "непроверенные классы — слепая зона" : null,
             s.blind_categories ? "hold" : "ok");
  }

  h += "<h3>Оплачиваемые задачи</h3>";
  const bs = ex.bounties || [];
  if (!bs.length) h += `<div class="empty">свободных задач нет — рынок разобран</div>`;
  bs.slice(0,5).forEach(b => {
    h += row(esc(b.repo), "$" + num(Math.round(b.amount_usd || 0)),
             esc((b.title||"").slice(0,84)));
  });

  h += "<h3>Работа наружу</h3>";
  h += row("Задач снято как разобранные", num(ex.bounty_dropped ?? 0),
           "выплачены другим или заняты толпой");
  h += row("Найденных работ у клиентов", "$" + num(Math.round(ex.pipeline_value ?? 0)),
           "прайс, а не выручка: никто ещё не платил");
  $("v-money").innerHTML = h;
}

function renderChain(){
  if(state.ex?.restricted){ $("v-chain").innerHTML = `<div class="empty">Детали задач не публикуются в открытом доступе.</div>`; return; }
  const m = (state.ex || {}).matrix || [];
  if (!m.length) { $("v-chain").innerHTML = `<div class="empty">матрица не построена</div>`; return; }
  let h = "<h3>От нуля до выручки</h3>";
  m.forEach(x => {
    const ok = x.verdict === "РАБОТАЕТ", wait = x.verdict === "НЕТ ВХОДА";
    h += `<div class="card ${ok?"ok":(wait?"":"bad")}">`
       + `<div class="h"><span class="pill ${ok?"ok":(wait?"hold":"bad")}">${esc(x.verdict)}</span>`
       + `${esc(x.stage)}</div>`
       + `<div class="d">${esc(x.owner_agent||"")}`
       + (x.blocker ? ` · ${esc(x.blocker)}` : "") + `</div></div>`;
  });
  $("v-chain").innerHTML = h;
}

function renderAgents(){
  const ags = (state.st || {}).agents || [];
  const runs = ((state.pulse||{}).runs) || [];
  const byAgent = {};
  runs.forEach(r => { byAgent[r.agent] = byAgent[r.agent] || {n:0,e:0};
                      byAgent[r.agent].n++; if (r.status==="error") byAgent[r.agent].e++; });
  const max = Math.max(1, ...Object.values(byAgent).map(v => v.n));
  let h = `<h3>Кто чем занят</h3>`;
  ags.forEach(a => {
    const st = byAgent[a.id] || {n:0,e:0};
    const col = "#" + ((AGENTS.find(x=>x.id===a.id)||{}).color||0x7a8aa6).toString(16).padStart(6,"0");
    h += `<div class="row ${st.e?"bad":""}">`
       + `<div class="t"><span class="pill" style="background:${col}22;color:${col}">${esc(a.id)}</span>`
       + `${esc(a.role||"")}</div>`
       + `<div class="v">${st.n||a.work||0}${st.e?` · ${st.e}✕`:""}</div>`
       + `<div class="bar"><i style="width:${Math.round((st.n/max)*100)}%;background:${col}"></i></div>`
       + `</div>`;
  });
  $("v-agents").innerHTML = h;
}

function renderQueue(){
  const q = state.q || {};
  if(q.restricted){ $("v-queue").innerHTML = `<div class="empty">Содержимое задач не публикуется в открытом доступе.</div>`; return; }
  let h = "";
  const esc2 = s => esc(String(s||"").slice(0,220));
  const ints = q.interventions || [], escs = q.escalations || [];
  if (escs.length){
    h += "<h3>Суждения ждут ответа</h3>";
    escs.slice(0,6).forEach(e => {
      let body = e.body;
      try { body = JSON.parse(e.body).question || e.body; } catch {}
      h += `<div class="card"><div class="h">${esc2(body)}</div>`
         + `<div class="d">${esc(e.sender)} · ${esc((e.created_at||"").slice(0,16))}</div></div>`;
    });
  }
  if (ints.length){
    h += "<h3>Нужны твои руки</h3>";
    ints.slice(0,8).forEach(i => {
      h += `<div class="card bad"><div class="h">${esc2(i.what)}</div>`
         + `<div class="d">${esc2(i.why)}</div></div>`;
    });
  }
  if (!h) h = `<div class="empty">от тебя сейчас ничего не требуется</div>`;
  $("v-queue").innerHTML = h;
}

/* Вид сообщения словом, а не кодом: владелец не обязан помнить, что
   «handoff» — это передача работы другому агенту. */
const TOPIC = { ask: "вопрос", answer: "ответ", handoff: "передал работу", chat: "" };

function renderChat(){
  if(state.chat?.restricted){ $("v-chat").innerHTML = `<div class="empty">Тексты переписки не публикуются в открытом доступе.</div>`; return; }
  const ms = ((state.chat||{}).messages) || [];
  if (!ms.length){ $("v-chat").innerHTML = `<div class="empty">агенты молчат</div>`; return; }
  const talk = ms.filter(m => m.recipient && m.recipient !== "ESCALATION").length;
  const t = (state.chat || {}).totals || {};
  const hist = [
    t.ask ? `вопросов ${t.ask}` : null,
    t.answer ? `ответов ${t.answer}` : null,
    t.handoff ? `передач работы ${t.handoff}` : null,
    t.chat ? `объявлений ${t.chat}` : null,
  ].filter(Boolean).join(" · ");
  let h = `<h3>Что говорят агенты</h3>`
        + `<div class="s" style="margin:-4px 0 4px">в этом окне ${ms.length} сообщений, `
        + `адресованных конкретному агенту — ${talk}</div>`
        + (hist ? `<div class="s" style="margin:0 0 10px;opacity:.8">за всё время: ${hist}</div>` : "");
  ms.slice(-45).reverse().forEach(m => {
    let body = m.body;
    try { const j = JSON.parse(m.body); body = j.text || j.question || j.task || j.body || m.body; } catch {}
    const kind = TOPIC[m.topic] ?? m.topic;
    /* Стрелка к адресату — это и есть ответ на вопрос «кто с кем работает».
       Раньше здесь стоял один отправитель, и переписка выглядела монологами. */
    const to = m.recipient && m.recipient !== "ESCALATION"
      ? `<span class="x" style="opacity:.75"> → ${esc(m.recipient)}</span>` : "";
    const tag = kind ? `<span class="s" style="margin-left:6px">${esc(kind)}</span>` : "";
    h += `<div class="msg ${m.recipient ? "direct" : ""}">`
       + `<span class="w">${esc(m.sender)}</span>${to}${tag}`
       + `<span class="x">${esc(String(body).slice(0,300))}</span></div>`;
  });
  $("v-chat").innerHTML = h;

  const feed = ((state.pulse||{}).runs||[]).slice(0,6).map(r =>
    `<div class="l"><b>${esc((r.started_at||"").slice(11,19))}</b> ${esc(r.agent)} · ${esc((r.notes||"").slice(0,70))}</div>`
  ).join("");
  $("feed").innerHTML = feed || `<div class="l">журнал пуст</div>`;
}

/* активность агентов подсвечивает их в сцене и гоняет импульсы по связям */
let lastRunId = 0;
let lastMsgId = 0;   // до какого сообщения искры уже пролетели
function animateActivity(){
  const runs = ((state.pulse||{}).runs) || [];
  runs.slice(0, 12).forEach(r => {
    const i = nodes.findIndex(n => n.userData.spec.id === r.agent);
    if (i < 0) return;
    nodes[i].userData.active = Math.min(1, nodes[i].userData.active + .5);
  });

  /* ИСКРА ЛЕТИТ ПО НАСТОЯЩЕМУ СООБЩЕНИЮ, А НЕ КУДА ПОПАЛО.
     Здесь стояло `Math.random()`: искры шли между случайными узлами и
     выглядели как переговоры агентов. Картинка была красивой и ничему не
     соответствовала — ровно та подделка работы, которую мы ловим в коде.
     Теперь летит только то, что действительно отправлено: от отправителя
     к адресату. Объявление всем искры не даёт — у него нет второго конца. */
  const ms = ((state.chat||{}).messages) || [];
  ms.forEach(m => {
    if (m.id <= lastMsgId || !m.recipient) return;
    const i = nodes.findIndex(n => n.userData.spec.id === m.sender);
    const j = nodes.findIndex(n => n.userData.spec.id === m.recipient);
    if (i >= 0 && j >= 0 && i !== j) sendPulse(i, j, nodes[i].userData.spec.color);
  });
  if (ms.length) lastMsgId = Math.max(lastMsgId, ...ms.map(m => m.id || 0));
}

function showCard(id){
  const a = ((state.st||{}).agents||[]).find(x => x.id === id);
  const spec = AGENTS.find(x => x.id === id) || {};
  const runs = (((state.pulse||{}).runs)||[]).filter(r => r.agent === id);
  const col = "#" + (spec.color||0x7a8aa6).toString(16).padStart(6,"0");
  const el = $("card");
  el.innerHTML = `<b style="color:${col}">${esc(spec.label||id)}</b>`
    + `<div class="r">${esc(a?.role || "роль не объявлена")}</div>`
    + `<div class="k"><span>прогонов в журнале</span><b>${runs.length}</b></div>`
    + `<div class="k"><span>сбоев</span><b>${runs.filter(r=>r.status==="error").length}</b></div>`
    + `<div class="k"><span>последний</span><b>${esc((runs[0]?.started_at||"—").slice(11,19))}</b></div>`
    + (runs[0] ? `<div class="r" style="margin-top:8px">${esc((runs[0].notes||"").slice(0,150))}</div>` : "");
  el.style.display = "block";
}

tick(); setInterval(tick, 5000);
</script>
